version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    container_name: ecommerce-website
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    depends_on:
      - php
  php:
    image: php:fpm
    volumes:
      - ./src:/var/www/html
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=magento
    depends_on:
      - db
  db:
    image: mysql:5.7
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=magento
volumes:
  db-data:
